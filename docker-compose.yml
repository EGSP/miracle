services:
  kreuzberg:
    image: ghcr.io/kreuzberg-dev/kreuzberg:latest
    ports:
      - '${KREUZBERG_HOST_PORT:-8000}:8000'
    environment:
      - KREUZBERG_MAX_UPLOAD_SIZE_MB=50
      - RUST_LOG=info
    healthcheck:
      test: ['CMD', 'kreuzberg', '--version']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Конвертация legacy .doc → .docx перед Kreuzberg (см. data-prepare-services/libreoffice).
  # Готовый образ unoserver + REST API; наружу не публикуем (REST без auth) — только во внутр. сети.
  libreoffice-convert:
    image: libreofficedocker/libreoffice-unoserver:3.19
    ports:
      - '${LIBREOFFICE_CONVERT_HOST_PORT:-2004}:2004'
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: miracle_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_HOST_PORT}:5432'
    volumes:
      - miracle-pg-data:/var/lib/postgresql/data

volumes:
  miracle-pg-data:
